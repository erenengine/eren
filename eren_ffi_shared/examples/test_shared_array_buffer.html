<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WASM Test Shared Array Buffer</title>
</head>

<body>
  <canvas id="canvas" width="640" height="480" style="width: 320px; height: 240px;"></canvas>
  <script type="module">
    import init from "./wasm/test_shared_array_buffer.js";
    const wasm = await init();

    const ptr = wasm.alloc_buffer(10);
    console.log("ptr:", ptr);

    const view = new Uint8Array(wasm.memory.buffer);

    // ptr ~ ptr+size까지 view를 보면 됩니다
    for (let i = 0; i < 10; i++) {
      view[ptr + i] = 42;  // JS에서 채움
    }

    console.log(view.subarray(ptr, ptr + 10));

    wasm.free_buffer(ptr, 10);
  </script>
</body>

</html>
